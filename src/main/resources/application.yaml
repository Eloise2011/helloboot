# 上一轮 /actuator/beans 是 404，这一轮能打开了。这中间你没有动任何 Java 代码，只在一个叫 application.yaml 的文件里加了下面这一个配置
# 配置 = 开关。 application.properties 是应用的「设置面板」，里面是一堆键值对开关。改开关的值，应用行为就变，不需要改代码、不需要重新编译。
management:
  endpoints:
    web:
      exposure:
        include: "*" # 注意有双引号, * 表示全部端点endpoint都放开了. Spring Boot 出于安全考虑，默认只把 health 这一个端点对外开放（其他端点可能暴露敏感信息）
  endpoint:
    env:
      show-values: always
app:
  feature:
    enabled: true # 这个开关是我自己定义的，Spring Boot 不认识它。它的作用是告诉应用，我想启用某个功能。你可以在代码里通过 @Value("${app.feature.enable}") 注入这个值，或者通过 @ConfigurationProperties 注入整个 app.feature 对象。
  greeting:
    enabled: true
    message: 你好, 自动配置 !
